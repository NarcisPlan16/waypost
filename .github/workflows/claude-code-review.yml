name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the review posts a top-level PR comment and inline
      # comments. With `read` the agent runs, fails to post, and returns
      # is_error -- which is how this check went red while never once
      # delivering a review.
      pull-requests: write
      issues: write
      id-token: write
      # lets the reviewer read this PR's CI results
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Enumerating tools is what has kept breaking this. The run on #8
          # ended with permission_denials_count: 1 after four turns and
          # posted nothing -- the plugin reached for something not on the
          # list. It drives `gh` through Bash, fans out to subagents and
          # tracks its nine steps, so the list is now the whole toolbox it
          # plausibly needs rather than a guess at the minimum.
          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh *),Bash(git *),Read,Grep,Glob,Task,TodoWrite"
          # TEMPORARY, remove once a review has actually posted: without it
          # the transcript is hidden, so a denial cannot be attributed.
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

