name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The reviewing agent must be able to EXECUTE the test suite, not just read it.
      # Three review rounds (#10, #12 twice) were done statically because every
      # `pytest` / `ruff` / `mypy` call came back "requires approval". Those rounds
      # still found real defects, but a reviewer that cannot run anything cannot
      # check whether the numbers in a PR body are true -- which is the whole exit
      # criterion from Sprint 2 onward. These two steps pre-install the environment
      # so `uv run pytest` works the moment Claude asks for it.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package + dev deps
        run: uv sync --extra dev

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Bash is allowed as a whole, deliberately. An enumerated allowlist was
          # tried twice and failed twice: Copilot Autofix narrowed it to
          # `Bash(gh *)` / `Bash(git *)` on #9 (silently reverting that PR's whole
          # point), and the deleted claude-code-review.yml kept outgrowing its own
          # list. This job holds read-only `contents` / `pull-requests` / `issues`
          # permissions, so the blast radius is this ephemeral runner.
          claude_args: '--allowed-tools Bash'

