[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waypost"
dynamic = ["version"]
description = "Zero-LLM-call repo indexer that gives coding agents a token-frugal map of a codebase."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narcis" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-language-pack>=0.4",
    "pathspec>=0.12",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://github.com/NarcisPlan16/waypost"
Repository = "https://github.com/NarcisPlan16/waypost"
Issues = "https://github.com/NarcisPlan16/waypost/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# The benchmark harness under bench/. Not part of the wheel, and not needed to
# run the test suite: everything except bench/client.py is importable without
# it, which is what keeps the harness covered by ordinary offline tests.
bench = [
    "anthropic>=0.70",
]

[project.scripts]
waypost = "waypost.cli:main"

[tool.hatch.version]
path = "src/waypost/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/waypost"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `bench/` is not an installed package -- it is deliberately outside the wheel
# -- so the repository root has to be importable for its tests to find it.
pythonpath = ["."]
