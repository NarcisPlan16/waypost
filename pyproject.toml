[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tacit"
version = "0.1.0"
description = "Zero-LLM-call repo indexer that gives coding agents a token-frugal map of a codebase."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Narcis" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
tacit = "tacit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tacit"]
